services:
  # ── Backend API (FastAPI) ──────────────────────────────────────────────────
  - type: web
    name: qosense-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: QOSENSE_ENV
        value: production
      - key: QOSENSE_DATA_MODE
        value: SIMULATION
      # Set QOSENSE_ALLOWED_ORIGINS to your Static Site URL after it is created.
      # Example: https://qosense-ui.onrender.com
      - key: QOSENSE_ALLOWED_ORIGINS
        value: https://qosense-ui.onrender.com
      - key: QOSENSE_ENABLE_LIVE_ENFORCEMENT
        value: "false"
      - key: QOSENSE_REQUIRE_POLICY_READBACK
        value: "true"

  # ── Frontend (React/Vite static site) ─────────────────────────────────────
  - type: web
    name: qosense-ui
    runtime: static
    region: oregon
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      # Set this to your Web Service URL after it is created.
      # Example: https://qosense-api.onrender.com
      - key: VITE_API_BASE_URL
        value: https://qosense-api.onrender.com
      - key: VITE_WS_BASE_URL
        value: wss://qosense-api.onrender.com
      - key: VITE_DEFAULT_DATA_MODE
        value: SIMULATION
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
